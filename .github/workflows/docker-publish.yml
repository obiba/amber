name: Publish Docker images

on:
  release:
    types: [published]

jobs:
  push_to_registry:
    name: Push ${{ matrix.image }} to Docker Hub
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - app: api
            image: obiba/amber
          - app: studio
            image: obiba/amber-studio
          - app: collect
            image: obiba/amber-collect
          - app: visit
            image: obiba/amber-visit
    env:
      REGISTRY: index.docker.io
    permissions:
      id-token: write
      contents: read
      attestations: write
      packages: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=match,pattern=(\d+\.\d+\.\d+),group=1
            type=match,pattern=(\d+\.\d+),group=1

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.app }}
          file: ./${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ matrix.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: false
